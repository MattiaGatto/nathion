# docker compose -f docker-compose.yml -f docker-compose.voice.yml up --build
services:
  backend:
    build:
      args:
        NATHION_EXTRAS: ${NATHION_EXTRAS:-dev,voice}
    environment:
      NATHION_VOICE_ENABLED: "true"
      NATHION_WHISPER_MODEL_PATH: ${NATHION_WHISPER_MODEL_PATH:-/models/whisper}
      NATHION_PIPER_MODEL_PATH: /models/voice.onnx
      NATHION_VOICE_LANGUAGE: it
      NATHION_VOICE_PROFILES: '{"riccardo":"/models/riccardo.onnx"}'
    volumes:
      - ./models:/models:ro
