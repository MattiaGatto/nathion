[project]
name = "nathion-backend"
version = "0.1.0"
description = "NATHION backend — FastAPI, LLM Gateway, persistenza conversazioni"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "websockets>=13.1",
    "pyyaml>=6,<7",
    "argon2-cffi>=23.1,<30",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
voice = ["faster-whisper>=1.2,<1.3", "piper-tts>=1.3,<2", "av>=16,<17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
