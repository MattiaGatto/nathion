# NATHION — Milestone 1 (Foundation)
#
# Avvia frontend e backend. Ollama NON è containerizzato: gira
# sull'host per sfruttare la GPU (costituzione §10), il backend lo
# raggiunge su NATHION_OLLAMA_BASE_URL (default: host.docker.internal,
# che funziona out-of-the-box con Docker Desktop su Windows/WSL2 e
# macOS — vedi README per Linux nativo).
#
# Uso:
#   cp .env.example .env
#   docker compose up --build

services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NATHION_ENVIRONMENT=${NATHION_ENVIRONMENT:-development}
      - NATHION_LOG_LEVEL=${NATHION_LOG_LEVEL:-INFO}
      - NATHION_DATABASE_URL=${NATHION_DATABASE_URL:-sqlite:///./data/nathion.db}
      - NATHION_OLLAMA_BASE_URL=${NATHION_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NATHION_OLLAMA_REQUEST_TIMEOUT_SECONDS=${NATHION_OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      - NATHION_OLLAMA_CONTEXT_SIZE=${NATHION_OLLAMA_CONTEXT_SIZE:-2048}
      - NATHION_OLLAMA_MAX_OUTPUT_TOKENS=${NATHION_OLLAMA_MAX_OUTPUT_TOKENS:-512}
      - NATHION_DEFAULT_LLM_PROVIDER=${NATHION_DEFAULT_LLM_PROVIDER:-ollama}
      - NATHION_CORS_ALLOW_ORIGINS=${NATHION_CORS_ALLOW_ORIGINS:-["http://localhost:4173","http://localhost:5173"]}
    extra_hosts:
      # Necessario su Linux: Docker Desktop (Windows/Mac) lo imposta già
      # da solo, ma dichiararlo esplicitamente non fa danno e rende il
      # file portabile sulle tre piattaforme.
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
